[game]
# Set binary, cl and vcvars to your own copies of these files (see README.md).
name = "Vampire: The Masquerade - Bloodlines (client)"
binary = "C:\\path\\to\\Vampire\\cl_dlls\\client.dll"
sha1 = "39a2d2556f08090542f2d186320b9012a83ffb6b"

[compiler]
cl = "C:\\path\\to\\vc6\\VC98\\BIN\\CL.EXE"
vcvars = "C:\\path\\to\\vc6\\vcvars32.bat"
prelude = "client.h"
flags = ["/O2", "/GR"]
timeout_s = 30

[agents]
claim_expiry_min = 30
max_attempts_per_claim = 20
prefer_sizes = [100, 400]
x87_heavy = 8
vector_calls = []

[cache]
prune_every_hours = 1
keep_hours = 2
